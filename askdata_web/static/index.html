<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
  <title>AskData</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23c96442'/%3E%3Cellipse cx='24' cy='15' rx='12' ry='5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M12 15v18c0 6.7 24 6.7 24 0V15M12 24c0 6.7 24 6.7 24 0' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <script>
    // 主题在样式加载前定下来，免得深色模式下先闪一下浅色。
    try { const t = localStorage.getItem("askdata-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!-- 连接状态、模型和数据集信息都来自 /api/health；提问走 /api/ask，新会话走 /api/reset，数据源浏览走 /api/schema。 -->
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3.5"/><path d="M4 5.5v13c0 4.7 16 4.7 16 0v-13M4 12c0 4.7 16 4.7 16 0"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H4l1.7-4A8 8 0 1 1 20 11.5Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M8 15v-4m5 4V7m5 8v-6"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/></symbol>
  </svg>

  <div class="app" id="app">
    <button class="scrim" id="nav-scrim" aria-label="关闭侧栏" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="会话与导航">
      <div class="sidebar-head">
        <a class="brand" href="/" aria-label="AskData 首页"><span class="brand-mark"><svg class="icon"><use href="#i-db"/></svg></span><span>AskData</span></a>
        <button class="icon-button" id="sidebar-close" aria-label="收起侧栏"><svg class="icon"><use href="#i-sidebar"/></svg></button>
      </div>
      <button class="new-session" id="new-session"><svg class="icon"><use href="#i-plus"/></svg><span>新会话</span><kbd>⌘K</kbd></button>
      <nav class="nav" aria-label="页面">
        <button class="nav-item" id="nav-chat" aria-current="page"><svg class="icon"><use href="#i-chat"/></svg>会话</button>
        <button class="nav-item" id="nav-source"><svg class="icon"><use href="#i-db"/></svg>数据源</button>
      </nav>
      <div class="sessions-head">最近</div>
      <div class="sessions" id="sessions"></div>
      <div class="sidebar-foot">
        <div class="status-line"><span class="dot" id="status-dot"></span><span id="status-text">正在连接服务…</span></div>
        <div class="status-sub" id="status-sub"></div>
      </div>
    </aside>

    <div class="main" id="main">
      <header class="topbar">
        <button class="icon-button" id="sidebar-open" aria-label="展开侧栏"><svg class="icon"><use href="#i-sidebar"/></svg></button>
        <h1 class="session-title" id="session-title">新会话</h1>
        <div class="topbar-actions">
          <button class="chip" id="dataset-chip" title="浏览数据源"><svg class="icon"><use href="#i-db"/></svg><span id="dataset-name">数据源</span></button>
          <button class="icon-button" id="theme-toggle" aria-label="切换深浅色"><svg class="icon"><use href="#i-moon"/></svg></button>
          <button class="icon-button" id="pane-toggle" aria-label="运行详情" aria-controls="pane" aria-expanded="false"><svg class="icon"><use href="#i-panel"/></svg></button>
        </div>
      </header>

      <div class="body">
        <section class="chat" id="chat-view">
          <div class="scroll" id="scroll">
            <div class="thread" id="thread" aria-live="polite"></div>
          </div>
          <div class="composer-dock" id="composer-dock">
            <form class="composer" id="composer">
              <label for="q" class="sr-only">输入问题</label>
              <textarea id="q" rows="1" maxlength="4000" placeholder="问一个数据问题…" autocomplete="off"></textarea>
              <div class="composer-row">
                <div class="composer-tags">
                  <span class="tag"><svg class="icon"><use href="#i-db"/></svg><span id="composer-dataset">数据源</span></span>
                  <span class="tag" title="只执行只读 SQL"><svg class="icon"><use href="#i-shield"/></svg>只读</span>
                </div>
                <div class="composer-right">
                  <span class="model" id="model">正在连接</span>
                  <button class="send" id="send" type="submit" aria-label="发送" disabled><svg class="icon"><use href="#i-arrow"/></svg></button>
                </div>
              </div>
            </form>
            <p class="composer-note" id="composer-note">Enter 发送，Shift + Enter 换行。回答由模型生成，请结合 SQL 核对结果。</p>
          </div>
        </section>

        <section class="source" id="source-view" hidden></section>

        <aside class="pane" id="pane" aria-label="运行详情" hidden>
          <div class="pane-head">
            <div class="pane-tabs" role="tablist" aria-label="详情分类">
              <button role="tab" data-tab="overview" aria-selected="true">概览</button>
              <button role="tab" data-tab="sql" aria-selected="false">SQL</button>
              <button role="tab" data-tab="schema" aria-selected="false">Schema</button>
            </div>
            <button class="icon-button" id="pane-close" aria-label="关闭详情"><svg class="icon"><use href="#i-close"/></svg></button>
          </div>
          <div class="pane-sub" id="pane-sub"></div>
          <div class="pane-body" id="pane-body" role="tabpanel"></div>
        </aside>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
