name: tests

# 每次推送和 PR 跑单元测试。单元测试不读 .env、不调真实模型，几十秒跑完。
on:
  push:
  pull_request:

# 同一分支连推几次时，只跑最新那次
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 版本只在 requirements.txt 里维护一份。本地模型那组（sentence-transformers、torch）
      # 单元测试用不上，装一次要几分钟，这里过滤掉；Milvus 那组要装，索引往返测试靠它。
      - name: Install dependencies
        run: |
          grep -vE '^(sentence-transformers|torch)\b' requirements.txt > ci-requirements.txt
          cat ci-requirements.txt | grep -vE '^\s*(#|$)'
          python -m pip install --upgrade pip
          python -m pip install -r ci-requirements.txt
          # 没装上时索引往返测试只会"跳过"，CI 照样绿——这里先确认真的装上了
          python -c "import numpy, pymilvus, milvus_lite"

      - name: Run unit tests
        run: python -m unittest discover -s tests
